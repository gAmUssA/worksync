name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug

      # WorkSyncCore is EventKit-free by design: CI has no calendar accounts
      # and no TCC grants. The in-memory CalendarStore fake covers integration.
      - name: Test
        run: swift test

      # DoctorChecks is pure and unit-tested, but DoctorFacts.gather shells out
      # to launchctl and codesign, opens a lock, and queries EventKit and
      # UserNotifications — none of which a unit test touches. Asserts only
      # things that hold with calendar access DENIED, which is the runner's
      # permanent state, so it exercises the real gather path without a TCC
      # grant. Read-only and no-prompt are checked here because those are the
      # guarantees doctor is documented on.
      - name: Doctor integration (real process, no TCC grant)
        run: ./scripts/check-doctor.sh "$(swift build -c debug --show-bin-path)/worksync"

      - name: SwiftFormat lint
        run: |
          brew install swiftformat
          swiftformat --lint .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    # macOS 26 deliberately, unlike build-test above: build-app.sh stamps the
    # binary with the SDK it compiled against, and macOS gates modern control
    # appearance on that stamp. Releasing from macos-15 would ship an app whose
    # UI silently falls back to legacy Aqua. build-test stays on macos-15 on
    # purpose, as the older toolchain that catches SDK-gated code (it already
    # caught one such break).
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Signed + notarized when the secrets exist, ad-hoc otherwise, so a fork
      # or a secretless repo still produces a working (if unnotarized) build
      # rather than failing the release outright.
      - name: Do we have signing secrets?
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::No DEVELOPER_ID_P12_BASE64 secret — building ad-hoc. \
            The result fails Gatekeeper and resets the calendar grant on every update."
          fi

      # Into a dedicated temporary keychain, never the default one: the runner
      # is shared-tenant and the key must not outlive the job.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI keychain prompt that no one
          # can answer on a headless runner, and the job hangs until timeout.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported .p12" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          export AC_API_KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$AC_API_KEY_PATH"
          trap 'rm -f "$AC_API_KEY_PATH"' EXIT
          scripts/build-app.sh --identity "$SIGNING_IDENTITY" --notarize

      - name: Build release bundle (ad-hoc, unnotarized)
        if: steps.signing.outputs.mode == 'adhoc'
        run: scripts/build-app.sh --adhoc

      # The tag is the source of truth for the version; a mismatch means the
      # artifact would claim a different version than the release page.
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$TAG" != "$PLIST" ]; then
            echo "tag $TAG != Info.plist $PLIST — bump Resources/Info.plist before tagging" >&2
            exit 1
          fi

      # Written per-mode: telling users a notarized build is ad-hoc (or the
      # reverse) is worse than saying nothing, since the install steps differ.
      - name: Compose release notes
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "Built on macOS 26 so the UI gets modern controls."
            echo
            if [ "$MODE" = "developer-id" ]; then
              cat <<'NOTARIZED'
          **Signed with a Developer ID and notarized by Apple.** It opens
          normally, and your calendar permission survives updates.

          ```
          curl -L -o worksync.tar.gz \
          NOTARIZED
              echo "  https://github.com/gAmUssA/worksync/releases/download/$TAG/WorkSync-$TAG-arm64.tar.gz"
              printf 'tar xzf worksync.tar.gz\n```\n'
            else
              cat <<'ADHOC'
          **This build is ad-hoc signed** — no signing identity was available.
          macOS Gatekeeper will refuse to open it, and the calendar permission
          resets on every update. Re-sign it locally with your own certificate;
          see the README section on Signing.

          Download with `curl`, not a browser: browser downloads are
          quarantined and this build is not notarized.

          ```
          curl -L -o worksync.tar.gz \
          ADHOC
              echo "  https://github.com/gAmUssA/worksync/releases/download/$TAG/WorkSync-$TAG-arm64.tar.gz"
              printf 'tar xzf worksync.tar.gz\n```\n'
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/WorkSync-${{ github.ref_name }}-arm64.tar.gz
            build/WorkSync-arm64.tar.gz
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md


  # The tap is a separate repo, so nothing here updates it on its own: the
  # cask's livecheck block only REPORTS a new version, it never rewrites the
  # file. Without this job every release ships while `brew install --cask`
  # still hands users the previous one.
  bump-tap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    # Serialize reruns of the same tag without letting another release replace
    # its pending bump. Different tags can run concurrently; the version guards
    # and push retry below handle updates to the shared tap branch.
    concurrency:
      group: bump-homebrew-tap-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Same shape as the signing-secret gate above: do the real thing when the
      # credential exists, say so loudly and skip when it does not, rather than
      # failing a release that already published successfully.
      #
      # A fine-grained PAT scoped to the tap repo with Contents: write.
      # Revoke it at github.com/settings/personal-access-tokens if it leaks.
      - name: Do we have a tap token?
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No HOMEBREW_TAP_TOKEN secret — the Homebrew cask was \
            NOT bumped and still points at the previous release. Update \
            gAmUssA/homebrew-worksync by hand, or add the secret."
          fi

      - name: Check out the tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: gAmUssA/homebrew-worksync
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # From the published asset, not from a local build: the cask's sha256
      # must describe the bytes users actually download. Re-hashing a local
      # artifact would pass here and fail on every user's machine if the
      # upload differed for any reason.
      - name: Bump and push the cask to the released version
        if: steps.token.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/WorkSync-${TAG}-arm64.tar.gz"

          curl -fsSL -o released.tar.gz "$URL"
          SHA=$(shasum -a 256 released.tar.gz | awk '{print $1}')
          echo "version=$VERSION sha256=$SHA"

          cd tap
          CASK=Casks/worksync.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild each attempt from the current tap rather than rebasing
          # competing edits to the same version and sha256 lines.
          for attempt in 1 2 3; do
            # Check before editing as well as after a rejected push: an older
            # release must never downgrade a newer cask with a fast-forward.
            CURRENT=$(sed -nE 's|^  version "([^"]*)"$|\1|p' "$CASK")
            NEWEST=$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | tail -1)
            if [ "$CURRENT" != "$VERSION" ] && [ "$NEWEST" = "$CURRENT" ]; then
              echo "::notice::Tap carries ${CURRENT}, newer than ${VERSION}. Leaving it alone."
              exit 0
            fi

            # Anchored to the specific keys so nothing else in the file can match.
            sed -i -E "s|^  version \"[^\"]*\"$|  version \"${VERSION}\"|" "$CASK"
            sed -i -E "s|^  sha256 \"[^\"]*\"$|  sha256 \"${SHA}\"|" "$CASK"

            # A sed that matched nothing leaves the file unchanged and would
            # otherwise commit nothing and pass silently.
            grep -q "version \"${VERSION}\"" "$CASK" || {
              echo "::error::cask version was not updated to ${VERSION}" >&2; exit 1; }
            grep -q "sha256 \"${SHA}\"" "$CASK" || {
              echo "::error::cask sha256 was not updated" >&2; exit 1; }

            ruby -c "$CASK"

            if git diff --quiet; then
              echo "Cask already at ${VERSION} — nothing to push."
              exit 0
            fi
            git add "$CASK"
            git commit -m "WorkSync cask ${VERSION}"
            if git push; then
              echo "Pushed cask ${VERSION} on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected — inspecting the tap's current state."
            git fetch origin

            # actions/checkout creates origin/<branch> but no origin/HEAD.
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            THEIRS=$(git show "origin/${BRANCH}:Casks/worksync.rb" \
              | sed -nE 's|^  version "([^"]*)"$|\1|p')
            NEWEST=$(printf '%s\n%s\n' "$VERSION" "$THEIRS" | sort -V | tail -1)
            if [ "$THEIRS" != "$VERSION" ] && [ "$NEWEST" = "$THEIRS" ]; then
              echo "::notice::Tap already carries ${THEIRS}, newer than ${VERSION}. Leaving it alone."
              exit 0
            fi

            # This checkout is disposable. Keep the downloaded asset's VERSION
            # and SHA in this step and reapply them on the fetched state.
            git reset --hard "origin/${BRANCH}"
          done

          echo "::error::Could not push the cask bump for ${VERSION} after 3 attempts. \
          Update gAmUssA/homebrew-worksync by hand." >&2
          exit 1
