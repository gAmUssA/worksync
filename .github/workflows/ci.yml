name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug

      # WorkSyncCore is EventKit-free by design: CI has no calendar accounts
      # and no TCC grants. The in-memory CalendarStore fake covers integration.
      - name: Test
        run: swift test

      # DoctorChecks is pure and unit-tested, but DoctorFacts.gather shells out
      # to launchctl and codesign, opens a lock, and queries EventKit and
      # UserNotifications — none of which a unit test touches. Asserts only
      # things that hold with calendar access DENIED, which is the runner's
      # permanent state, so it exercises the real gather path without a TCC
      # grant. Read-only and no-prompt are checked here because those are the
      # guarantees doctor is documented on.
      - name: Doctor integration (real process, no TCC grant)
        run: ./scripts/check-doctor.sh "$(swift build -c debug --show-bin-path)/worksync"

      - name: SwiftFormat lint
        run: |
          brew install swiftformat
          swiftformat --lint .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    # macOS 26 deliberately, unlike build-test above: build-app.sh stamps the
    # binary with the SDK it compiled against, and macOS gates modern control
    # appearance on that stamp. Releasing from macos-15 would ship an app whose
    # UI silently falls back to legacy Aqua. build-test stays on macos-15 on
    # purpose, as the older toolchain that catches SDK-gated code (it already
    # caught one such break).
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Signed + notarized when the secrets exist, ad-hoc otherwise, so a fork
      # or a secretless repo still produces a working (if unnotarized) build
      # rather than failing the release outright.
      - name: Do we have signing secrets?
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::No DEVELOPER_ID_P12_BASE64 secret — building ad-hoc. \
            The result fails Gatekeeper and resets the calendar grant on every update."
          fi

      # Into a dedicated temporary keychain, never the default one: the runner
      # is shared-tenant and the key must not outlive the job.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI keychain prompt that no one
          # can answer on a headless runner, and the job hangs until timeout.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported .p12" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          export AC_API_KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$AC_API_KEY_PATH"
          trap 'rm -f "$AC_API_KEY_PATH"' EXIT
          scripts/build-app.sh --identity "$SIGNING_IDENTITY" --notarize

      - name: Build release bundle (ad-hoc, unnotarized)
        if: steps.signing.outputs.mode == 'adhoc'
        run: scripts/build-app.sh --adhoc

      # The tag is the source of truth for the version; a mismatch means the
      # artifact would claim a different version than the release page.
      - name: Version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "$TAG" != "$PLIST" ]; then
            echo "tag $TAG != Info.plist $PLIST — bump Resources/Info.plist before tagging" >&2
            exit 1
          fi

      # Written per-mode: telling users a notarized build is ad-hoc (or the
      # reverse) is worse than saying nothing, since the install steps differ.
      - name: Compose release notes
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "Built on macOS 26 so the UI gets modern controls."
            echo
            if [ "$MODE" = "developer-id" ]; then
              cat <<'NOTARIZED'
          **Signed with a Developer ID and notarized by Apple.** It opens
          normally, and your calendar permission survives updates.

          ```
          curl -L -o worksync.tar.gz \
          NOTARIZED
              echo "  https://github.com/gAmUssA/worksync/releases/download/$TAG/WorkSync-$TAG-arm64.tar.gz"
              printf 'tar xzf worksync.tar.gz\n```\n'
            else
              cat <<'ADHOC'
          **This build is ad-hoc signed** — no signing identity was available.
          macOS Gatekeeper will refuse to open it, and the calendar permission
          resets on every update. Re-sign it locally with your own certificate;
          see the README section on Signing.

          Download with `curl`, not a browser: browser downloads are
          quarantined and this build is not notarized.

          ```
          curl -L -o worksync.tar.gz \
          ADHOC
              echo "  https://github.com/gAmUssA/worksync/releases/download/$TAG/WorkSync-$TAG-arm64.tar.gz"
              printf 'tar xzf worksync.tar.gz\n```\n'
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/WorkSync-${{ github.ref_name }}-arm64.tar.gz
            build/WorkSync-arm64.tar.gz
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md

