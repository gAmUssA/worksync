name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug

      # WorkSyncCore is EventKit-free by design: CI has no calendar accounts
      # and no TCC grants. The in-memory CalendarStore fake covers integration.
      - name: Test
        run: swift test

      - name: SwiftFormat lint
        run: |
          brew install swiftformat
          swiftformat --lint .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # CI has no signing identity: ad-hoc sign. Users re-sign locally with a
      # stable certificate (see README) so the TCC calendar grant persists.
      - name: Build release bundle (ad-hoc signed)
        run: scripts/build-app.sh --adhoc

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/WorkSync-*.tar.gz
